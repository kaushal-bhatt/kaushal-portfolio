# =============================================================================
#  Push to main  ->  build + roll out, on the server.
#
#  The server is a phone (arm64) running the stack in Docker, with a
#  self-hosted runner registered from THIS repository under the label `phone`
#  (a personal account cannot share a runner between repositories). It builds
#  the image natively, so nothing goes through a registry, and hands it to
#  ~/wekt/deploy.sh, which switches the live build, health-checks it and rolls
#  back on failure.
# =============================================================================
name: Deploy

# No `pull_request` trigger, on purpose: this repository is public and the
# runner is a personal device, so that trigger would let anyone execute
# arbitrary code on it by opening a PR. Fork PR workflows also need manual
# approval in the repository settings.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, phone]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # No separate test step: the image build runs `npm run build`, and
      # next.config.js keeps `typescript.ignoreBuildErrors` false, so a type
      # error fails this step. The Dockerfile's npm cache mount keeps installs warm.
      - name: Build image
        run: docker build -t "portfolio:${GITHUB_SHA::7}" .

      - name: Roll out
        run: bash /root/wekt/deploy.sh portfolio "${GITHUB_SHA::7}"
