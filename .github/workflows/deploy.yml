# =============================================================================
#  Push to main  ->  build image  ->  push to GHCR  ->  roll out.
#
#  Deliberately mirrors auth-platform's workflow: same self-hosted-runner model,
#  same registry, same rollout script on the server. The two repositories deploy
#  independently — each owns its own image.
#
#  NOTE: a self-hosted runner belongs to ONE repository (shared runners exist
#  only at organisation level, which a personal account does not have), so this
#  needs its OWN runner registered from this repo. Same machine is fine.
# =============================================================================
name: Deploy

# No `pull_request` trigger, on purpose: this repository is public and the
# runner is a personal machine, so that trigger would let anyone execute
# arbitrary code on it by opening a PR.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/portfolio

jobs:
  deploy:
    runs-on: [self-hosted, windows]
    timeout-minutes: 30

    # Windows PowerShell, explicitly. NOT `bash`: the `bash` on PATH on this
    # machine is WSL's, which sees a different filesystem (/mnt/c/...).
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      # ghcr.io hands out transient timeouts, and one of them failing the whole
      # deploy is not worth it. The action has no retry of its own, so a second
      # attempt is a second step guarded on the first one's outcome.
      - name: Log in to GHCR
        id: ghcr_login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR (retry)
        if: steps.ghcr_login.outcome == 'failure'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No separate test step: the image build runs `npm run build`, and
      # next.config.js keeps `typescript.ignoreBuildErrors` false, so a type
      # error fails this step. Running the build twice would only be slower.
      #
      # The Dockerfile's npm cache mount keeps dependency installs warm between
      # runs, and the daemon keeps the layer cache.
      - name: Build image
        run: |
          docker build --platform linux/amd64 `
            -t "${{ env.IMAGE }}:${{ github.sha }}" `
            -t "${{ env.IMAGE }}:latest" .

      # Each push is retried: a registry timeout here used to fail the deploy
      # outright, and layers already uploaded are skipped on the retry so a
      # second attempt is cheap. Every push still needs its own exit-code check
      # because $ErrorActionPreference does not apply to native executables, so a
      # failed first push would otherwise be masked by a successful second one.
      - name: Push image
        run: |
          function Push-WithRetry([string]$Tag) {
            for ($i = 1; $i -le 3; $i++) {
              docker push $Tag
              if ($LASTEXITCODE -eq 0) { return }
              if ($i -lt 3) {
                Write-Host "push of $Tag failed (exit $LASTEXITCODE); attempt $i of 3, retrying in $($i * 10)s"
                Start-Sleep -Seconds ($i * 10)
              }
            }
            throw "push of $Tag failed after 3 attempts"
          }

          Push-WithRetry "${{ env.IMAGE }}:${{ github.sha }}"
          Push-WithRetry "${{ env.IMAGE }}:latest"

      # The rollout script lives in the auth-platform checkout on the server,
      # because that is where docker-compose.yml and .env are — one stack, two
      # images.
      - name: Roll out to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'deploy_key'
          $kh  = Join-Path $env:RUNNER_TEMP 'deploy_known_hosts'

          # OpenSSH rejects a private key with CRLF line endings or no trailing
          # newline, and PowerShell's redirection would give it both.
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $keyText = ($env:DEPLOY_SSH_KEY -replace "`r`n", "`n")
          if (-not $keyText.EndsWith("`n")) { $keyText += "`n" }
          [System.IO.File]::WriteAllText($key, $keyText, $utf8NoBom)
          [System.IO.File]::WriteAllText($kh, ($env:DEPLOY_KNOWN_HOSTS -replace "`r`n", "`n") + "`n", $utf8NoBom)

          # Windows OpenSSH refuses to use a key file other accounts can read.
          icacls $key /inheritance:r /grant:r "$(whoami):(R)" | Out-Null

          ssh -i $key `
              -o IdentitiesOnly=yes `
              -o UserKnownHostsFile="$kh" `
              -o StrictHostKeyChecking=yes `
              -o BatchMode=yes `
              "$env:DEPLOY_USER@$env:DEPLOY_HOST" `
              "cd ~/auth-platform && git pull --ff-only && bash deploy/remote-deploy.sh portfolio '${{ github.sha }}'"

          if ($LASTEXITCODE -ne 0) { throw "Rollout failed (ssh exit $LASTEXITCODE)" }

      - name: Shred the deploy key
        if: always()
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue `
            (Join-Path $env:RUNNER_TEMP 'deploy_key'), `
            (Join-Path $env:RUNNER_TEMP 'deploy_known_hosts')
