# Local development stack. Production runs from auth-platform/deploy/, where this
# app sits behind Caddy next to auth-service and shares that box's Postgres.
#
#   cp .env.example .env   # then fill it in
#   docker compose up -d --build
#
# Nothing here carries a secret. An earlier version of this file hardcoded
# NEXTAUTH_SECRET, which meant anyone reading this public repository could forge
# an admin session cookie without ever seeing a password. That variable is gone
# entirely now — the app verifies auth-platform's tokens and signs nothing of its
# own. Values come from .env, which is gitignored, and the `:?` syntax below
# makes compose refuse to start with a clear message rather than falling back to
# something guessable.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    ports:
      # 5433 on the host so this does not collide with a Postgres you may
      # already have running locally on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 10

  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # `postgres` is the service name on the compose network, and 5432 is the
      # container's own port — the 5433 mapping above is only for the host.
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-portfolio}
      # Admin sign-in goes through auth-platform; this app verifies the JWT it
      # gets back and signs nothing itself, so there is no session secret here.
      AUTH_PLATFORM_URL: ${AUTH_PLATFORM_URL:-https://auth.wekt.in}
      PORTFOLIO_BASE_URL: ${PORTFOLIO_BASE_URL:-http://localhost:3000}
      AUTH_PLATFORM_SSO_CLIENT_ID: ${AUTH_PLATFORM_SSO_CLIENT_ID:-portfolio}
      # Server-to-server only — a browser never sees it. Left empty for local
      # work: /admin then fails at sign-in, which is correct, rather than the
      # whole stack refusing to start.
      AUTH_PLATFORM_SSO_CLIENT_SECRET: ${AUTH_PLATFORM_SSO_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
